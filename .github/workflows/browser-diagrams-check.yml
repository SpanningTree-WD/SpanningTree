name: Browser diagram verification
on:
  pull_request:
    paths:
      - 'src/components/content/**'
      - 'src/features/admin/DiagramEditor*'
      - 'src/features/admin/MarkdownEditor*'
      - 'src/services/diagrams/**'
      - 'scripts/browser-diagrams/**'
      - 'tests/browser/**'
      - 'playwright.diagrams.config.ts'
      - 'package*.json'
      - '.github/workflows/browser-diagrams-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser-diagrams
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagram-results
          path: test-results/
