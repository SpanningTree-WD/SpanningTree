name: Firebase Hosting live
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_PUBLIC_DATA_SOURCE: firebase
          VITE_UPLOAD_TRIGGER_URL: ${{ vars.VITE_UPLOAD_TRIGGER_URL || 'https://spanningtree-upload-trigger.spanning-tree-website.workers.dev/trigger' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # This service account has Hosting access, not Firebase Rules administration.
      # Publish changed firestore.rules with an authorized administrator before
      # releasing frontend features that depend on them (see ARTICLE_AUTHORING.md).
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPANNINGTREE_MATH }}
          projectId: spanningtree-math
          channelId: live
